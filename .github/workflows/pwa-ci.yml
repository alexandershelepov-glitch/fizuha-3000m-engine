name: PWA regression checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run build:web
      - run: npm run demo
      - run: npm run audit:training
      - name: Verify deployable GitHub Pages PWA
        run: |
          npm run build:web
          node scripts/prepare-pages.mjs
        env:
          PWA_BASE: /fizuha-3000m-engine/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-simulator-report
          path: audit/reports/training-audit.*
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - run: npm run test:e2e:pages
